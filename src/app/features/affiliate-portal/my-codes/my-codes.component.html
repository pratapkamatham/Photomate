<div class="space-y-6">

  <h2 class="text-2xl font-semibold text-white">My Codes</h2>

  <app-loader *ngIf="isLoading"></app-loader>

  <div *ngIf="!isLoading && codes.length === 0"
       class="bg-[#1a1a1a] border border-[#2a2a2a] rounded-sm p-12 text-center">
    <p class="text-gray-400">
      No codes assigned yet. Contact admin.
    </p>
  </div>

  <div *ngIf="!isLoading && codes.length > 0"
       class="grid grid-cols-1 sm:grid-cols-2 gap-4">

    <div *ngFor="let code of codes"
         class="bg-[#1a1a1a] border border-[#2a2a2a] rounded-sm p-5 hover:border-[#c9a96e]/30 transition-colors">

      <div class="flex items-center justify-between mb-4">
        <span class="font-mono font-bold text-[#c9a96e] text-2xl">
          {{ code.code }}
        </span>
        <span class="text-xs px-2 py-1 rounded-sm font-medium"
              [ngClass]="{
                'bg-blue-900/30 text-blue-400': code.type === 'coupon',
                'bg-purple-900/30 text-purple-400': code.type === 'referral'
              }">
          {{ code.type | titlecase }}
        </span>
      </div>

      <div class="space-y-2 mb-4">
        <div class="flex justify-between text-sm">
          <span class="text-gray-500">Discount</span>
          <span class="text-white">
            {{ code.type === 'coupon'
               ? code.discountPercent + '%'
               : 'No discount' }}
          </span>
        </div>
        <div class="flex justify-between text-sm">
          <span class="text-gray-500">Times used</span>
          <span class="text-white">{{ code.usageCount }}</span>
        </div>
      </div>

      <div class="bg-[#111111] rounded-sm px-3 py-2 mb-4 border border-[#2a2a2a]">
        <p class="text-xs text-gray-500 mb-1">Referral Link</p>
        <p class="text-xs text-gray-400 truncate">
          {{ 'register?ref=' + code.code }}
        </p>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <button
          (click)="copyCode(code.code)"
          class="text-xs border py-2 rounded-sm transition-colors"
          [class.border-green-500]="copiedCode === code.code"
          [class.text-green-400]="copiedCode === code.code"
          [class.border-[#2a2a2a]]="copiedCode !== code.code"
          [class.text-gray-400]="copiedCode !== code.code">
          {{ copiedCode === code.code ? '✓ Copied!' : '📋 Copy Code' }}
        </button>

        <button
          (click)="copyLink(code)"
          class="text-xs border py-2 rounded-sm transition-colors"
          [class.border-green-500]="copiedCode === code.code + '_link'"
          [class.text-green-400]="copiedCode === code.code + '_link'"
          [class.border-[#2a2a2a]]="copiedCode !== code.code + '_link'"
          [class.text-gray-400]="copiedCode !== code.code + '_link'">
          {{ copiedCode === code.code + '_link'
             ? '✓ Copied!'
             : '🔗 Copy Link' }}
        </button>

        <button
          (click)="shareOnWhatsApp(code)"
          class="col-span-2 text-xs bg-green-600/20 border border-green-600/40 text-green-400 py-2.5 rounded-sm hover:bg-green-600/30 transition-colors font-medium">
          💬 Share on WhatsApp
        </button>
      </div>

    </div>

  </div>

</div>
