<div class="min-h-screen bg-[#111111] flex items-center justify-center px-4">
 
  <div class="w-full max-w-md">
 
    <!-- Logo / Brand -->
    <div class="text-center mb-10">
      <h1 class="text-3xl font-bold text-white tracking-widest uppercase">
        Photo<span class="text-[#c9a96e]">Mate</span>
      </h1>
      <p class="text-gray-400 text-sm mt-2">
        Join as a Photographer
      </p>
    </div>
 
    <!-- Card -->
    <div class="bg-[#1a1a1a] border border-[#2a2a2a] rounded-sm p-8">
 
      <h2 class="text-xl font-semibold text-white mb-6">
        Create Account
      </h2>
 
      <!-- Error Message -->
      <div
        *ngIf="errorMessage"
        class="mb-4 px-4 py-3 bg-red-900/30 border border-red-500/30
               rounded-sm text-red-400 text-sm">
        {{ errorMessage }}
      </div>
 
      <!-- Form -->
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
 
        <!-- Email -->
        <div class="mb-5">
          <label class="block text-sm text-gray-400 mb-2">
            Email Address
          </label>
          <input
            type="email"
            formControlName="email"
            placeholder="you@example.com"
            class="w-full bg-[#111111] border border-[#2a2a2a] text-white
                   placeholder-gray-600 rounded-sm px-4 py-3 text-sm
                   focus:outline-none focus:border-[#c9a96e] transition-colors"
            [class.border-red-500]="email?.invalid && email?.touched"
          />
          <p *ngIf="email?.invalid && email?.touched"
             class="text-red-400 text-xs mt-1">
            Please enter a valid email address.
          </p>
        </div>
 
        <!-- Password -->
        <div class="mb-5">
          <label class="block text-sm text-gray-400 mb-2">
            Password
          </label>
          <div class="relative">
            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="••••••••"
              class="w-full bg-[#111111] border border-[#2a2a2a] text-white
                     placeholder-gray-600 rounded-sm px-4 py-3 text-sm
                     focus:outline-none focus:border-[#c9a96e] transition-colors pr-12"
              [class.border-red-500]="password?.invalid && password?.touched"
            />
            <button type="button" (click)="togglePassword()"
              class="absolute right-3 top-1/2 -translate-y-1/2
                     text-gray-500 hover:text-gray-300 text-xs">
              {{ showPassword ? 'HIDE' : 'SHOW' }}
            </button>
          </div>
          <p *ngIf="password?.invalid && password?.touched"
             class="text-red-400 text-xs mt-1">
            Password must be at least 6 characters.
          </p>
        </div>
 
        <!-- Confirm Password -->
        <div class="mb-6">
          <label class="block text-sm text-gray-400 mb-2">
            Confirm Password
          </label>
          <div class="relative">
            <input
              [type]="showConfirmPassword ? 'text' : 'password'"
              formControlName="confirmPassword"
              placeholder="••••••••"
              class="w-full bg-[#111111] border border-[#2a2a2a] text-white
                     placeholder-gray-600 rounded-sm px-4 py-3 text-sm
                     focus:outline-none focus:border-[#c9a96e] transition-colors pr-12"
              [class.border-red-500]="confirmPassword?.touched &&
                registerForm.hasError('passwordMismatch')"
            />
            <button type="button" (click)="toggleConfirmPassword()"
              class="absolute right-3 top-1/2 -translate-y-1/2
                     text-gray-500 hover:text-gray-300 text-xs">
              {{ showConfirmPassword ? 'HIDE' : 'SHOW' }}
            </button>
          </div>
          <p *ngIf="confirmPassword?.touched && registerForm.hasError('passwordMismatch')"
             class="text-red-400 text-xs mt-1">
            Passwords do not match.
          </p>
        </div>
 
        <!-- Submit -->
        <button
          type="submit"
          [disabled]="isLoading"
          class="w-full bg-[#c9a96e] text-black font-semibold py-3 rounded-sm
                 hover:bg-[#b8935a] transition-colors duration-200
                 disabled:opacity-50 disabled:cursor-not-allowed
                 flex items-center justify-center gap-2">
          <span *ngIf="isLoading"
                class="w-4 h-4 border-2 border-black border-t-transparent
                       rounded-full animate-spin">
          </span>
          {{ isLoading ? 'Creating Account...' : 'Create Account' }}
        </button>
 
      </form>
 
      <!-- Login Link -->
      <p class="text-center text-gray-500 text-sm mt-6">
        Already have an account?
        <a routerLink="/auth/login"
           class="text-[#c9a96e] hover:underline ml-1">
          Sign In
        </a>
      </p>
 
    </div>
 
  </div>
</div>
