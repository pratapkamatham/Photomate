<div class="space-y-6">
 
  <h2 class="text-2xl font-semibold text-white">Subscriptions</h2>
 
  <!-- Loading -->
  <app-loader *ngIf="isLoading"></app-loader>
 
  <!-- Empty -->
  <div
    *ngIf="!isLoading && subscriptions.length === 0"
    class="bg-[#1a1a1a] border border-[#2a2a2a] rounded-sm p-12
           text-center">
    <p class="text-gray-400">No subscriptions found yet.</p>
  </div>
 
  <!-- Table -->
  <div
    *ngIf="!isLoading && subscriptions.length > 0"
    class="bg-[#1a1a1a] border border-[#2a2a2a] rounded-sm overflow-hidden">
 
    <table class="w-full text-sm">
      <thead>
        <tr class="border-b border-[#2a2a2a]">
          <th class="text-left px-5 py-3 text-gray-400 font-medium">
            Photographer ID
          </th>
          <th class="text-left px-5 py-3 text-gray-400 font-medium">
            Plan
          </th>
          <th class="text-left px-5 py-3 text-gray-400 font-medium">
            Status
          </th>
          <th class="text-left px-5 py-3 text-gray-400 font-medium">
            Amount
          </th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let sub of subscriptions"
          class="border-b border-[#2a2a2a] hover:bg-white/5 transition-colors">
          <td class="px-5 py-4 text-gray-400 text-xs">
            {{ sub.photographerId }}
          </td>
          <td class="px-5 py-4">
            <span class="px-2 py-1 rounded-sm text-xs font-medium
                         bg-[#c9a96e]/10 text-[#c9a96e]">
              {{ sub.plan }}
            </span>
          </td>
          <td class="px-5 py-4">
            <span
              [class.text-green-400]="sub.status === 'active'"
              [class.text-red-400]="sub.status === 'expired'"
              [class.text-yellow-400]="sub.status === 'suspended'"
              class="text-xs font-medium">
              {{ sub.status }}
            </span>
          </td>
          <td class="px-5 py-4 text-white">
            ₹{{ sub.amount }}
          </td>
        </tr>
      </tbody>
    </table>
 
  </div>
 
</div>
