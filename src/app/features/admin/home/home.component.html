<div class="space-y-8">
 
  <!-- Header -->
  <div>
    <h2 class="text-2xl font-semibold text-white">Platform Overview</h2>
    <p class="text-gray-400 text-sm mt-1">
      PhotoMate Super Admin Dashboard
    </p>
  </div>
 
  <!-- Stats -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
    <div
      *ngFor="let stat of stats"
      class="bg-[#1a1a1a] border border-[#2a2a2a] rounded-sm p-5
             hover:border-[#c9a96e]/30 transition-colors duration-200">
      <span class="text-2xl text-[#c9a96e]">{{ stat.icon }}</span>
      <p class="text-2xl font-bold text-white mt-3">{{ stat.value }}</p>
      <p class="text-xs text-gray-500 mt-1">{{ stat.label }}</p>
    </div>
  </div>
 
  <!-- Quick Links -->
  <div>
    <h3 class="text-sm font-medium text-gray-400 uppercase
               tracking-wider mb-4">
      Manage
    </h3>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
 
      <a routerLink="/admin/photographers"
         class="flex items-center gap-4 bg-[#1a1a1a] border border-[#2a2a2a]
                rounded-sm p-5 hover:border-[#c9a96e]/50 transition-colors
                no-underline group">
        <span class="text-2xl text-[#c9a96e]">◫</span>
        <div>
          <p class="text-white text-sm font-medium
                    group-hover:text-[#c9a96e] transition-colors">
            Photographers
          </p>
          <p class="text-gray-500 text-xs">
            Manage accounts and subscriptions
          </p>
        </div>
      </a>
 
      <a routerLink="/admin/subscriptions"
         class="flex items-center gap-4 bg-[#1a1a1a] border border-[#2a2a2a]
                rounded-sm p-5 hover:border-[#c9a96e]/50 transition-colors
                no-underline group">
        <span class="text-2xl text-[#c9a96e]">★</span>
        <div>
          <p class="text-white text-sm font-medium
                    group-hover:text-[#c9a96e] transition-colors">
            Subscriptions
          </p>
          <p class="text-gray-500 text-xs">
            View and manage plans
          </p>
        </div>
      </a>
 
    </div>
  </div>
  </div>
