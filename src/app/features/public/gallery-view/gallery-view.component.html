<div
  *ngIf="notFound && !isLoading"
  class="min-h-screen bg-[#111111] flex flex-col
         items-center justify-center px-4 text-center">
  <p class="text-6xl mb-6">📷</p>
  <h2 class="text-2xl font-semibold text-white mb-2">
    Gallery Not Found
  </h2>
  <p class="text-gray-400 text-sm">
    This gallery may be private or no longer available.
  </p>
  <button
    (click)="goBack()"
    class="mt-6 text-[#c9a96e] text-sm hover:underline">
    ← Back to Portfolio
  </button>
</div>
 
<!-- Loading -->
<div *ngIf="isLoading"
     class="min-h-screen bg-[#111111]">
  <app-loader></app-loader>
</div>
 
<!-- Gallery View -->
<div
  *ngIf="!isLoading && !notFound && gallery"
  class="min-h-screen"
  [style.background-color]="photographer?.theme?.backgroundColor || '#111111'"
  [style.color]="photographer?.theme?.textColor || '#ffffff'"
  [style.font-family]="photographer?.theme?.font || 'Poppins'">
 
  <!-- Sticky Header -->
  <header
    class="sticky top-0 z-10 border-b backdrop-blur-sm"
    [style.background-color]="(photographer?.theme?.backgroundColor || '#111111') + 'ee'"
    [style.border-color]="(photographer?.theme?.accentColor || '#c9a96e') + '20'">
 
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center
                justify-between">
 
      <div class="flex items-center gap-4">
        <button
          (click)="goBack()"
          class="opacity-50 hover:opacity-100 transition-opacity
                 text-sm">
          ← {{ photographer?.studioName }}
        </button>
        <span class="opacity-20">|</span>
        <h1 class="font-semibold text-sm md:text-base truncate">
          {{ gallery.title }}
        </h1>
      </div>
 
      <span class="text-sm opacity-40 shrink-0">
        {{ assets.length }} photos
      </span>
 
    </div>
  </header>
 
  <!-- Photo Grid - Masonry Style -->
  <main class="max-w-7xl mx-auto px-4 py-10">
 
    <!-- Empty -->
    <div *ngIf="assets.length === 0"
         class="text-center py-20 opacity-40">
      <p>No photos in this gallery yet.</p>
    </div>
 
    <!-- Masonry Grid -->
    <div
      *ngIf="assets.length > 0"
      class="columns-1 sm:columns-2 md:columns-3
             lg:columns-4 gap-3 space-y-3">
 
      <div
        *ngFor="let asset of assets; let i = index"
        class="break-inside-avoid cursor-pointer group
               overflow-hidden rounded-sm"
        (click)="openLightbox(i)">
 
        <div class="relative overflow-hidden"
             [style.background-color]="(photographer?.theme?.accentColor || '#c9a96e') + '10'">
 
          <img
            [src]="buildImageUrl(asset, 500)"
            [alt]="'Photo ' + (i + 1)"
            class="w-full h-auto object-cover transition-transform
                   duration-500 group-hover:scale-105"
            loading="lazy"
          />
 
          <!-- Hover overlay -->
          <div class="absolute inset-0 bg-black/20 opacity-0
                      group-hover:opacity-100 transition-opacity
                      duration-300 flex items-center justify-center">
            <span class="text-white text-2xl">⊕</span>
          </div>
 
        </div>
 
      </div>
 
    </div>
 
  </main>
 
  <!-- Footer -->
  <footer
    class="border-t py-8 text-center"
    [style.border-color]="(photographer?.theme?.accentColor || '#c9a96e') + '20'">
    <p class="text-xs opacity-30">
      Powered by
      <span
        [style.color]="photographer?.theme?.accentColor || '#c9a96e'"
        class="opacity-100">
        PhotoMate
      </span>
    </p>
  </footer>
 
</div>
 
 
<!-- ================================================ -->
<!-- LIGHTBOX OVERLAY -->
<!-- ================================================ -->
<div
  *ngIf="lightboxOpen && currentAsset"
  class="fixed inset-0 z-50 bg-black/96
         flex items-center justify-center"
  (click)="closeLightbox()">
 
  <!-- Close -->
  <button
    (click)="closeLightbox()"
    class="absolute top-4 right-4 text-white/60
           hover:text-white transition-colors z-10
           w-10 h-10 flex items-center justify-center
           text-2xl">
    ✕
  </button>
 
  <!-- Counter -->
  <div class="absolute top-4 left-1/2 -translate-x-1/2
              text-white/40 text-sm">
    {{ lightboxIndex + 1 }} / {{ assets.length }}
  </div>
 
  <!-- Prev -->
  <button
    (click)="prevImage(); $event.stopPropagation()"
    class="absolute left-3 md:left-6 text-white/60
           hover:text-white transition-colors z-10
           w-12 h-12 flex items-center justify-center
           bg-black/40 rounded-full text-2xl">
    ‹
  </button>
 
  <!-- Image -->
  <img
    [src]="buildFullUrl(currentAsset)"
    [alt]="'Photo ' + (lightboxIndex + 1)"
    class="max-h-[90vh] max-w-[90vw] object-contain
           rounded-sm shadow-2xl"
    (click)="$event.stopPropagation()"
  />
 
  <!-- Next -->
  <button
    (click)="nextImage(); $event.stopPropagation()"
    class="absolute right-3 md:right-6 text-white/60
           hover:text-white transition-colors z-10
           w-12 h-12 flex items-center justify-center
           bg-black/40 rounded-full text-2xl">
    ›
  </button>
 
  <!-- Keyboard hint -->
  <div class="absolute bottom-4 left-1/2 -translate-x-1/2
              text-white/20 text-xs hidden md:block">
    ← → Navigate &nbsp;|&nbsp; ESC Close
  </div>
 
</div>
