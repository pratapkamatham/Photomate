<div class="space-y-6 max-w-2xl">
  <div class="flex items-center gap-4">
    <button type="button" (click)="cancel()" class="text-gray-400 hover:text-white transition-colors">Back</button>
    <h2 class="text-2xl font-semibold text-white">Create Portfolio Section</h2>
  </div>

  <div class="bg-[#1a1a1a] border border-[#2a2a2a] rounded-sm p-6">
    <div *ngIf="errorMessage" class="mb-4 px-4 py-3 bg-red-900/30 border border-red-500/30 rounded-sm text-red-400 text-sm">
      {{ errorMessage }}
    </div>

    <form [formGroup]="sectionForm" (ngSubmit)="onSubmit()">
      <div class="mb-5 bg-[#111111] border border-[#2a2a2a] rounded-sm p-4">
        <p class="text-white text-sm font-medium">Section examples</p>
        <p class="text-gray-500 text-xs mt-1 mb-3">These are public showcase categories, separate from client galleries.</p>
        <div class="flex flex-wrap gap-2">
          <button type="button" *ngFor="let preset of presets" (click)="applyPreset(preset)" class="text-xs border border-[#c9a96e]/30 text-[#c9a96e] px-3 py-1.5 rounded-sm hover:bg-[#c9a96e]/10">
            {{ preset }}
          </button>
        </div>
      </div>

      <div class="mb-5">
        <label class="block text-sm text-gray-400 mb-2">Section Title <span class="text-[#c9a96e]">*</span></label>
        <input type="text" formControlName="title" placeholder="e.g. Wedding Shots" class="w-full bg-[#111111] border border-[#2a2a2a] text-white placeholder-gray-600 rounded-sm px-4 py-3 text-sm focus:outline-none focus:border-[#c9a96e]" [class.border-red-500]="title?.invalid && title?.touched" />
      </div>

      <div class="mb-5">
        <label class="block text-sm text-gray-400 mb-2">Public URL Slug <span class="text-[#c9a96e]">*</span></label>
        <input type="text" formControlName="slug" placeholder="wedding-shots" class="w-full bg-[#111111] border border-[#2a2a2a] text-white placeholder-gray-600 rounded-sm px-4 py-3 text-sm focus:outline-none focus:border-[#c9a96e]" [class.border-red-500]="slug?.invalid && slug?.touched" />
        <p class="text-gray-600 text-xs mt-1">Public URL: /your-studio/portfolio/{{ sectionForm.value.slug || 'section-slug' }}</p>
      </div>

      <div class="mb-5">
        <label class="block text-sm text-gray-400 mb-2">Description</label>
        <textarea formControlName="description" rows="3" placeholder="Short description for this shoot category..." class="w-full bg-[#111111] border border-[#2a2a2a] text-white placeholder-gray-600 rounded-sm px-4 py-3 text-sm focus:outline-none focus:border-[#c9a96e] resize-none"></textarea>
      </div>

      <label class="mb-6 bg-[#111111] border border-[#2a2a2a] rounded-sm p-4 flex items-center justify-between gap-4">
        <span>
          <span class="block text-white text-sm font-medium">Private Section</span>
          <span class="block text-gray-500 text-xs mt-0.5">Hide from public portfolio.</span>
        </span>
        <input type="checkbox" formControlName="isPrivate" class="h-5 w-5 accent-[#c9a96e]" />
      </label>

      <div class="flex gap-3">
        <button type="button" (click)="cancel()" class="flex-1 border border-[#2a2a2a] text-gray-400 font-medium py-3 rounded-sm hover:border-gray-500 hover:text-white">Cancel</button>
        <button type="submit" [disabled]="isLoading" class="flex-1 bg-[#c9a96e] text-black font-semibold py-3 rounded-sm hover:bg-[#b8935a] disabled:opacity-50">
          {{ isLoading ? 'Creating...' : 'Create Section & Upload' }}
        </button>
      </div>
    </form>
  </div>
</div>
