<div class="space-y-6 max-w-2xl">
 
  <div class="flex items-center gap-4">
    <button
      (click)="cancel()"
      class="text-gray-400 hover:text-white transition-colors">
      ← Back
    </button>
    <h2 class="text-2xl font-semibold text-white">Create Gallery</h2>
  </div>
 
  <div class="bg-[#1a1a1a] border border-[#2a2a2a] rounded-sm p-6">
 
    <!-- Error -->
    <div
      *ngIf="errorMessage"
      class="mb-4 px-4 py-3 bg-red-900/30 border border-red-500/30
             rounded-sm text-red-400 text-sm">
      {{ errorMessage }}
    </div>
 
    <form [formGroup]="galleryForm" (ngSubmit)="onSubmit()">
 
      <!-- Title -->
      <div class="mb-5">
        <label class="block text-sm text-gray-400 mb-2">
          Gallery Title <span class="text-[#c9a96e]">*</span>
        </label>
        <input
          type="text"
          formControlName="title"
          placeholder="e.g. Sharma Wedding"
          class="w-full bg-[#111111] border border-[#2a2a2a] text-white
                 placeholder-gray-600 rounded-sm px-4 py-3 text-sm
                 focus:outline-none focus:border-[#c9a96e] transition-colors"
          [class.border-red-500]="title?.invalid && title?.touched"
        />
        <p *ngIf="title?.invalid && title?.touched"
           class="text-red-400 text-xs mt-1">
          Title must be at least 3 characters.
        </p>
      </div>
 
      <!-- Slug -->
      <div class="mb-5">
        <label class="block text-sm text-gray-400 mb-2">
          Gallery URL Slug <span class="text-[#c9a96e]">*</span>
        </label>
        <div class="flex items-center gap-2">
          <span class="text-gray-600 text-sm shrink-0">
            photomate.in/your-studio/gallery/
          </span>
          <input
            type="text"
            formControlName="slug"
            placeholder="sharma-wedding"
            class="flex-1 bg-[#111111] border border-[#2a2a2a] text-white
                   placeholder-gray-600 rounded-sm px-4 py-3 text-sm
                   focus:outline-none focus:border-[#c9a96e] transition-colors"
            [class.border-red-500]="slug?.invalid && slug?.touched"
          />
        </div>
        <p class="text-gray-600 text-xs mt-1">
          Auto-generated from title. Only lowercase letters, numbers, hyphens.
        </p>
        <p *ngIf="slug?.invalid && slug?.touched"
           class="text-red-400 text-xs mt-1">
          Slug must be lowercase with hyphens only (e.g. sharma-wedding).
        </p>
      </div>
 
      <!-- Description -->
      <div class="mb-5">
        <label class="block text-sm text-gray-400 mb-2">
          Description (optional)
        </label>
        <textarea
          formControlName="description"
          rows="3"
          placeholder="Brief description of this event..."
          class="w-full bg-[#111111] border border-[#2a2a2a] text-white
                 placeholder-gray-600 rounded-sm px-4 py-3 text-sm
                 focus:outline-none focus:border-[#c9a96e] transition-colors
                 resize-none">
        </textarea>
      </div>
 
      <!-- Private Toggle -->
      <div class="mb-6 flex items-center justify-between p-4
                  bg-[#111111] border border-[#2a2a2a] rounded-sm">
        <div>
          <p class="text-white text-sm font-medium">Private Gallery</p>
          <p class="text-gray-500 text-xs mt-0.5">
            Only accessible via direct link
          </p>
        </div>
        <label class="relative inline-flex items-center cursor-pointer">
          <input
            type="checkbox"
            formControlName="isPrivate"
            class="sr-only peer"
          />
          <div class="w-11 h-6 bg-[#2a2a2a] peer-focus:outline-none
                      rounded-full peer
                      peer-checked:after:translate-x-full
                      peer-checked:after:border-white
                      after:content-[''] after:absolute after:top-[2px]
                      after:left-[2px] after:bg-white after:rounded-full
                      after:h-5 after:w-5 after:transition-all
                      peer-checked:bg-[#c9a96e]">
          </div>
        </label>
      </div>
 
      <!-- Actions -->
      <div class="flex gap-3">
        <button
          type="button"
          (click)="cancel()"
          class="flex-1 border border-[#2a2a2a] text-gray-400 font-medium
                 py-3 rounded-sm hover:border-gray-500 hover:text-white
                 transition-colors">
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="isLoading"
          class="flex-1 bg-[#c9a96e] text-black font-semibold py-3 rounded-sm
                 hover:bg-[#b8935a] transition-colors duration-200
                 disabled:opacity-50 disabled:cursor-not-allowed
                 flex items-center justify-center gap-2">
          <span *ngIf="isLoading"
                class="w-4 h-4 border-2 border-black border-t-transparent
                       rounded-full animate-spin">
          </span>
          {{ isLoading ? 'Creating...' : 'Create & Upload Photos' }}
        </button>
      </div>
 
    </form>
  </div>
</div>
