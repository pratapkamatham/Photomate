<div class="min-h-screen bg-[#111111] flex flex-col items-center justify-center px-4">
 
  <!-- 404 Number -->
  <h1 class="text-[120px] font-bold leading-none text-[#c9a96e] opacity-20 select-none">
    404
  </h1>
 
  <!-- Message -->
  <h2 class="text-2xl font-semibold text-white mt-4">
    Page Not Found
  </h2>
  <p class="text-gray-400 mt-2 text-center max-w-sm">
    The page you are looking for does not exist or has been moved.
  </p>
 
  <!-- Back Button -->
  <button
    (click)="goHome()"
    class="mt-8 px-8 py-3 bg-[#c9a96e] text-black font-semibold rounded-sm
           hover:bg-[#b8935a] transition-colors duration-200">
    Go Home
  </button>
 
</div>
